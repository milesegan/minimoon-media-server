name: macOS Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BUNDLE_DIR: target/universal-apple-darwin/release/bundle
      UPDATE_ASSET: MiniMoon-Media-Server.app.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! cargo metadata --no-deps --locked --format-version 1 |
            jq -e --arg version "$version" '.packages | all(.version == $version)' >/dev/null ||
            ! jq -e --arg version "$version" '.version == $version' gui/package.json >/dev/null; then
            echo "::error::Tag $GITHUB_REF_NAME must match the Cargo workspace and gui/package.json versions"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: gui/package.json
          cache: true
          cache_dependency_path: gui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: gui
      - run: pnpm test
        working-directory: gui
      - run: cargo test --workspace --all-targets --locked

      # Tauri notarizes and staples the app before archiving it for the updater.
      - name: Build universal installer and signed updater archive
        working-directory: gui
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked

      # Submit the DMG separately so Apple issues a ticket for the installer download itself.
      - name: Verify updater archive and notarize the DMG
        id: assets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          apps=("$BUNDLE_DIR"/macos/*.app)
          dmgs=("$BUNDLE_DIR"/dmg/*.dmg)
          if [[ ${#apps[@]} != 1 || ${#dmgs[@]} != 1 ]]; then
            echo "::error::Expected one application and one disk image in $BUNDLE_DIR"
            exit 1
          fi
          app="${apps[0]}"
          dmg="${dmgs[0]}"
          archive="$app.tar.gz"
          signature="$archive.sig"
          if [[ ! -s "$archive" || ! -s "$signature" ]]; then
            echo "::error::Missing signed updater archive in $BUNDLE_DIR"
            exit 1
          fi
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf "$archive" -C "$extracted"
          archived_app="$extracted/$(basename "$app")"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$archived_app/Contents/Info.plist")
          architectures=" $(lipo -archs "$archived_app/Contents/MacOS/$executable") "
          if [[ "$architectures" != *" arm64 "* || "$architectures" != *" x86_64 "* ]]; then
            echo "::error::Updater archive must contain both arm64 and x86_64"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$archived_app"
          xcrun stapler validate "$archived_app"

          codesign --verify --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

          # Use a URL-safe asset name that GitHub Releases will preserve.
          mv "$archive" "$BUNDLE_DIR/$UPDATE_ASSET"
          mv "$signature" "$BUNDLE_DIR/$UPDATE_ASSET.sig"
          printf 'dmg=%s\n' "$dmg" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMG: ${{ steps.assets.outputs.dmg }}
        run: |
          tag="$GITHUB_REF_NAME"
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "MiniMoon Media Server $tag" \
              --notes 'Download the DMG, open it, and drag MiniMoon Media Server to Applications. The installer contains both Apple silicon and Intel builds.'
          fi
          archive="$BUNDLE_DIR/$UPDATE_ASSET"
          url="https://github.com/$GH_REPO/releases/download/$tag/$UPDATE_ASSET"
          jq -n --arg version "${tag#v}" --arg url "$url" \
            --arg signature "$(tr -d '\r\n' < "$archive.sig")" '
            {url: $url, signature: $signature} as $mac |
            {version: $version, platforms: {"darwin-aarch64": $mac, "darwin-x86_64": $mac}}
          ' > "$BUNDLE_DIR/latest.json"
          gh release upload "$tag" "$DMG" "$archive" "$archive.sig" "$BUNDLE_DIR/latest.json" --clobber
          gh release edit "$tag" --draft=false
