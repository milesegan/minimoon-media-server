[package]
name = "minimoon-media-server-gui"
version = "1.0.2"
edition = "2021"
description = "Desktop app to configure and control the MiniMoon Media Server"
license = "MIT"
publish = false

[[bin]]
name = "minimoon-media-server-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
minimoon-media-server = { path = "../.." }
minimoon-media-server-gui-types = { path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.29.2"

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1.0.154"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
